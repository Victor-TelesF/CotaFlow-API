[project]
name = "python-api-template"
version = "0.1.0"
description = "Base mínima para APIs Python com FastAPI e SQLAlchemy"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0,<0.163",
    "uvicorn>=0.54.0,<0.55",
    "sqlalchemy>=2.1.8,<2.2",
    "alembic>=1.20.1,<2",
    "pydantic-settings>=2.16.2,<3",
    "psycopg[binary]>=3.3.8,<4",
]

[tool.uv]
package = false
