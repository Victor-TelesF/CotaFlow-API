x-database-environment: &database-environment
  DB_DRIVER: ${DB_DRIVER:-postgresql+psycopg}
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:?Defina DB_NAME no .env}
  DB_USER: ${DB_USER:?Defina DB_USER no .env}
  DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}

services:
  api:
    build: .
    image: cotaflow-api:local
    environment:
      <<: *database-environment
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Defina uma chave aleatoria JWT_SECRET_KEY no .env}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-[]}
      MIGRATION_LOCK_TIMEOUT_SECONDS: ${MIGRATION_LOCK_TIMEOUT_SECONDS:-30}
      AUTH_REGISTER_PER_10_MINUTES: ${AUTH_REGISTER_PER_10_MINUTES:-5}
      AUTH_LOGIN_PER_MINUTE: ${AUTH_LOGIN_PER_MINUTE:-20}
      AUTH_LOGIN_PAIR_PER_5_MINUTES: ${AUTH_LOGIN_PAIR_PER_5_MINUTES:-5}
      AUTH_MAX_CONCURRENT: ${AUTH_MAX_CONCURRENT:-2}
      PORTFOLIO_TRANSACTIONS_PER_MINUTE: ${PORTFOLIO_TRANSACTIONS_PER_MINUTE:-30}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      MARKET_MAX_TICKERS: ${MARKET_MAX_TICKERS:-20}
      MARKET_VALUATIONS_PER_MINUTE: ${MARKET_VALUATIONS_PER_MINUTE:-10}
      MARKET_EXTERNAL_CALLS_PER_MINUTE: ${MARKET_EXTERNAL_CALLS_PER_MINUTE:-30}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build: .
    image: cotaflow-api:local
    profiles: ["tools"]
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-environment
      MIGRATION_LOCK_TIMEOUT_SECONDS: ${MIGRATION_LOCK_TIMEOUT_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME no .env}
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
